# ================================================================
# OpenOCD: MSPM0G3507 + DAPLink (CMSIS-DAP)
# 使用 TI 定制 OpenOCD: D:\ti_openocd\openocd\bin\openocd.exe
# ================================================================
# 用法:
#   D:\ti_openocd\openocd\bin\openocd.exe -f mspm0g3507_daplink.cfg
#
# CLion 配置:
#   Settings → Embedded Development → OpenOCD
#   路径: D:\ti_openocd\openocd\bin\openocd.exe
#   Board Config: mspm0g3507_daplink.cfg
#
# GDB:
#   arm-none-eabi-gdb xxx.elf
#   (gdb) target extended-remote localhost:3333
#   (gdb) monitor reset halt
#   (gdb) load      # 烧录 Flash ✓ (原生 mspm0 驱动)
#   (gdb) continue
# ================================================================

# ---------- 调试适配器 ----------
source [find interface/cmsis-dap.cfg]
adapter speed 1000

# ---------- MSPM0 目标 (含 Flash 驱动) ----------
source [find target/ti_mspm0.cfg]

# ---------- GDB / Telnet 端口 ----------
gdb_port 3333
telnet_port 4444

# ---------- 启动 ----------
init
reset init

echo "============================================"
echo " MSPM0G3507 + DAPLink 就绪 (TI OpenOCD)"
echo " GDB:    localhost:3333"
echo " Telnet: localhost:4444"
echo " Flash:  GDB 'load' 直接烧录"
echo " 特殊命令: mspm0_mass_erase  mspm0_factory_reset"
echo "============================================"
